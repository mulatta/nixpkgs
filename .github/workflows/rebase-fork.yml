name: Rebase fork on upstream

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ vars.NIXPKGS_REBASE_APP_ID }}
          private-key: ${{ secrets.NIXPKGS_REBASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: main

      - name: Rebase on upstream
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch --filter=blob:none https://github.com/NixOS/nixpkgs nixos-unstable
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rebase FETCH_HEAD
          git push --force-with-lease "https://x-access-token:${APP_TOKEN}@github.com/mulatta/nixpkgs" HEAD:main
